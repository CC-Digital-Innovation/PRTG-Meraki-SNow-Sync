resources:
  # Resource for triggering pipeline
  - name: repo-read
    type: git
    icon: github
    source:
      uri: ((repo))
      branch: ((branch))
      username: ((git.username))
      password: ((git.password))
      # Determines what files trigger the pipeline
      paths:
        - ((project_root))
        - Dockerfile
        - requirements.txt
  
  # Resource for bumping the version in the manifest file
  - name: infra-branch-manifest
    type: git
    icon: github
    source:
      uri: ((repo))
      branch: infra
      username: ((git.username))
      password: ((git.password))
      paths:
        - ((manifest_path))

  # Production image registry resource
  - name: prod-image-registry
    type: registry-image
    source:
      repository: ((harbor.repository))/((image))
      username: ((harbor.username))
      password: ((harbor.password))
  
  # Development image registry resource
  - name: dev-image-registry
    type: registry-image
    source:
      repository: ((harbor.repository))/((image))
      variant: dev
      username: ((harbor.username))
      password: ((harbor.password))

  # Resource for versioning file
  - name: versioning-file
    type: semver
    icon: numeric
    source:
      initial_version: 0.0.1
      driver: git
      uri: ((ssh_url))
      branch: version
      file: version
      private_key: ((git.private_key))
      git_user: "Concourse Bot <concourse.bot@example.com>"
      commit_message: "bump to version %version%"


jobs:
  - name: promote-dev-image-to-prod
    plan:
      # Trigger the pipeline when there is a PR merge to the "main" branch
      - get: repo-read
        trigger: true
      # Get the dev image
      - get: dev-image-registry
        params:
          format: oci
      # Scan the dev image for vulnerabilities
      - task: trivy-scan
        config:
          platform: linux
          image_resource:
            type: registry-image
            source:
              repository: aquasec/trivy
              tag: latest
          inputs:
            - name: dev-image-registry
          run:
            path: sh
            args:
              - -c
              - trivy image --no-progress --exit-code 1 --severity HIGH,CRITICAL --input dev-image-registry/image.tar
      # Get and bump the current version
      - get: versioning-file
        params:
          bump: patch
      # Save the bumped version to a variable
      - load_var: bumped_version
        file: versioning-file/version
      # Push the dev image with the bumped version as the prod image
      - put: prod-image-registry
        no_get: true
        params:
          image: dev-image-registry/image.tar
          version: ((.:bumped_version))
      # Push the new version to the version file in the "version" branch
      - put: versioning-file
        no_get: true
        params:
          bump: patch
      # Use the bumped version in the manifest file
      - get: infra-branch-manifest
      - task: bump-with-yq
        config:
          platform: linux
          image_resource:
            type: registry-image
            source:
              repository: docker.io/mikefarah/yq
          inputs:
            - name: infra-branch-manifest
          outputs:
            - name: bumped-manifest-file
          run:
            path: sh
            args:
              - -exc
              - |
                cd infra-branch-manifest
                yq -i '.spec.template.spec.containers[0].image = "((harbor.repository))/((image)):((.:bumped_version))"' ((manifest_path))
            user: root
      # Commit the bumped manifest file to the "infra" branch
      - task: git-commit-bumped-manifest
        config:
          platform: linux
          image_resource:
            type: registry-image
            source:
              repository: docker.io/alpine/git
          inputs:
            - name: bumped-manifest-file
          outputs:
            - name: infra-branch-manifest
          run:
            path: sh
            args:
              - -exc
              - |
                cd bumped-manifest-file
                git config --global user.email '<concourse.bot@example.com>'
                git config --global user.name "Concourse Bot"
                git add ((manifest_path))
                git commit -m 'bump to ((.:bumped_version))'
      # Push the committed bumped manifest file to the "infra" branch
      - put: infra-branch-manifest
        params:
          repository: infra-branch-manifest
